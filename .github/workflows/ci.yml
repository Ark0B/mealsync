# Continuous integration: every push and pull request runs the full test suite twice —
# once on SQLite (fast) and once on a real MySQL 8 server (the production database).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov-report

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mealsync_test
          MYSQL_USER: mealsync
          MYSQL_PASSWORD: mealsync
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CLIENT: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: mealsync
      DB_PASSWORD: mealsync
      DB_NAME: mealsync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
